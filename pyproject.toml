[project]
name = "medinfo-ops-agent"
version = "0.0.0"
description = "Human-controlled synthetic medical-information workflow"
requires-python = "==3.14.6"
dependencies = [
    "fastapi>=0.141.1",
    "psycopg[binary]>=3.3.4",
    "uvicorn>=0.41.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ruff>=0.16.1",
]
