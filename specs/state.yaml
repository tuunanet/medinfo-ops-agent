active_decisions:
- decision_id: solo-git-workflow
  decision: Use the complete solo-local story lifecycle without mandatory pull requests.
  rationale: Preserve worktree isolation and verification while removing solo PR ceremony.
  artifact: specs/workflows/solo-git.yaml
- decision_id: documentation-validated-v0-2-baseline
  decision: Use the confirmed framework, provider, orchestration, MCP, retrieval,
    persistence, and execution boundaries for v0.2.
  rationale: Official documentation resolved external assumptions before scope and
    implementation planning.
  artifact: specs/tech-architecture/tech-stack.md
- decision_id: v0-1-v0-2-delivery-scope
  decision: Bound the current initiative to the v0.1 manual vertical slice and v0.2
    recruiter-demonstrable AI increment.
  rationale: Deliver one deeply developed fictional product within 70 hours and defer
    target-v1.0 breadth to later scope decisions.
  artifact: specs/product/SCOPE_LATEST.yaml
- decision_id: v0-1-v0-2-vertical-slices
  decision: Deliver seven epics through fourteen vertical stories totaling 64 Business
    Complexity Points.
  rationale: Each story adds demonstrable reviewer or evaluator value and stays at
    five BCPs or less.
  artifact: specs/release-plan.yaml
- decision_id: e01s01-local-topology
  decision: Run Next.js and FastAPI on pinned host runtimes and run PostgreSQL and
    pgvector through direct rootless Podman commands.
  rationale: Keep local iteration fast with one daemonless container runtime and no
    Compose provider or Docker fallback.
  artifact: specs/adr/ADR-0002-rootless-podman-for-local-database.md
- decision_id: sqlalchemy-alembic-persistence
  decision: Use SQLAlchemy 2 typed mappings and Alembic migrations while keeping Pydantic,
    domain, and persistence representations separate.
  rationale: Preserve explicit trust and domain boundaries while supporting PostgreSQL
    relationships, constraints, immutable records, and pgvector.
  artifact: specs/adr/ADR-0001-sqlalchemy-persistence-and-alembic-migrations.md
- decision_id: e01s02-development-auth
  decision: Use a development-only fictional actor switcher with a signed HttpOnly
    session and server-owned permission resolution.
  rationale: Provide attributable local identities without implementing production
    identity infrastructure before v0.2.
  artifact: specs/epics/e01-executable-local-foundation/e01s02-use-attributable-local-roles.md
- decision_id: e01s01-bootstrap-preflight-exception
  decision: Use the verified planning baseline once to create the e01s01 worktree
    before the root Preflight command exists.
  rationale: e01s01t01 owns the initial root command harness; all later gates must
    use make preflight.
  artifact: specs/verifications/e01s01-bootstrap-baseline.md
